steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE_URI}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE_URI}
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_IMAGE_URI}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --service-account=${_SERVICE_ACCOUNT}
      - --cpu=${_CPU}
      - --memory=${_MEMORY}
      - --timeout=${_TIMEOUT}
      - --concurrency=${_CONCURRENCY}
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --set-env-vars=${_ENV_VARS}
      - --update-secrets=${_SECRET_VARS}
images:
  - ${_IMAGE_URI}
substitutions:
  _IMAGE_URI: asia-south1-docker.pkg.dev/$PROJECT_ID/roop-veda/web:latest
  _SERVICE_NAME: roop-veda-web
  _REGION: asia-south1
  _SERVICE_ACCOUNT: roop-veda-run@$PROJECT_ID.iam.gserviceaccount.com
  _CPU: "1"
  _MEMORY: 512Mi
  _TIMEOUT: 300s
  _CONCURRENCY: "80"
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "10"
  _ENV_VARS: NEXT_PUBLIC_APP_URL=https://REPLACE_ME,NEXT_PUBLIC_BRAND_NAME=Roop Veda,NEXT_PUBLIC_DEFAULT_CURRENCY=usd,GCS_BUCKET_NAME=REPLACE_ME,TEMP_MANUAL_ACCESS_ENABLED=false,META_API_VERSION=v19.0
  _SECRET_VARS: DATABASE_URL=DATABASE_URL:latest,AUTH_JWT_SECRET=AUTH_JWT_SECRET:latest,ZAAKPAY_MERCHANT_IDENTIFIER=ZAAKPAY_MERCHANT_IDENTIFIER:latest,ZAAKPAY_SECRET_KEY=ZAAKPAY_SECRET_KEY:latest,RESEND_API_KEY=RESEND_API_KEY:latest,RESEND_FROM_EMAIL=RESEND_FROM_EMAIL:latest,META_ACCESS_TOKEN=META_ACCESS_TOKEN:latest,NEXT_PUBLIC_META_PIXEL_ID=NEXT_PUBLIC_META_PIXEL_ID:latest
